# ProtocolBridge v2.0 配置（完整版：握手准入 + 包翻译，无需 v1.x 配套）
# 一个插件同时完成：① 改协议号让 1.26.x 旧版客户端连进来 ② 翻译游戏包让双方看得懂

# ============ 功能 1：握手协议号改写 + 进服通报 ============

# 是否启用版本绕行（改写登录包协议号，让 1.26.x 各版本进入服务器）
enable_version_bypass = true

# 是否启用玩家进服全服通报
enable_join_announcement = true

# 进服通报消息模板，占位符：{name} 玩家名，{version} 游戏版本
announcement_template = "[{name}]该玩家是[{version}]，欢迎你加入服务器！"

# 1.26.x 协议号精确白名单，只改写这些协议号的客户端：
#   2225=26.60~26.66  2193=26.50~26.52  2169=26.45  2168=26.40~26.44
#   1001=26.30~26.35  975=26.20~26.23  944=26.10~26.13  924=1.26.0~26.3
# 想只放行最稳的相邻版本，改成 [2193, 2225] 即可
allowed_protocols = [924, 944, 975, 1001, 2168, 2169, 2193, 2225]

# 协议号差值兜底（默认 1400 覆盖整个 1.26.x 跨度 1301），主判定以白名单为准
max_protocol_diff = 1400

# ============ 功能 2：游戏包跨版本翻译 ============

# 是否启用包翻译（关闭则只做握手准入，不翻译游戏包）
enable_translation = true

# 只翻译这些包ID（实测 2193→2225 需要翻译的 8 个）。
# 留空/删除该项则使用内置默认列表：[11, 12, 13, 44, 58, 77, 93, 348]
# only_packet_ids = [11, 12, 13, 44, 58, 77, 93, 348]

# 严格模式：跨版本且翻译失败时阻断该包（谨慎，默认 false=放行）
strict = false

# ============ 通用 ============

# 输出详细调试日志（会打印协议号改写判定和每次翻译）
debug = false

# 关闭时输出统计（握手命中率 + 分档 + 翻译统计）
enable_stats = true
