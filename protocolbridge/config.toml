# ProtocolBridge v2.0 配置（完整版：握手准入 + 包翻译，无需 v1.x 配套）
# 一个插件同时完成：① 改协议号让 1.26.x 旧版客户端连进来 ② 翻译游戏包让双方看得懂

# ============ 功能 1：握手协议号改写 + 进服通报 ============

# 是否启用版本绕行（改写登录包协议号，让 1.26.x 各版本进入服务器）
enable_version_bypass = true

# 是否启用玩家进服全服通报
enable_join_announcement = true

# 进服通报消息模板，占位符：{name} 玩家名，{version} 游戏版本
announcement_template = "[{name}]该玩家是[{version}]，欢迎你加入服务器！"

# 协议号精确白名单，只改写这些协议号的客户端（1.21.x 全系 + 1.26.x 全系）：
#   1.26.x: 2225=26.60~26.66 2193=26.50~26.52 2169=26.45 2168=26.40~26.44
#           1001=26.30~26.35 975=26.20~26.23 944=26.10~26.13 924=1.26.0~26.3
#   1.21.x: 898=1.21.130~132 859=1.21.120~123 844=1.21.111~114 827=1.21.100~101
#           819=1.21.92~94 818=1.21.90~91 800=1.21.80~84 786=1.21.70~73
#           776=1.21.60~62 766=1.21.50~51 748=1.21.40~44 729=1.21.30~31
#           712=1.21.20~23 686=1.21.2~3 685=1.21.0~1
# 想只放行最稳的相邻版本，按需缩减此列表即可
allowed_protocols = [685, 686, 712, 729, 748, 766, 776, 786, 800, 818, 819, 827, 844, 859, 860, 898, 924, 944, 975, 1001, 2168, 2169, 2193, 2225]

# 协议号差值兜底（默认 1540 覆盖 1.21.0~1.26.65 跨度），主判定以白名单为准
max_protocol_diff = 1540

# ============ 功能 2：游戏包跨版本翻译 ============

# 是否启用包翻译（关闭则只做握手准入，不翻译游戏包）
enable_translation = true

# 1.21.x 跨大版本深度翻译（v3.0 新增）。
# 开启后：1.21.x 客户端走逐包深度翻译（能正确显示世界/移动/交互），
#         1.26.x 客户端仍走原有轻量翻译（互不干扰）。
# 关闭则退回 v2.1 的浅层翻译，1.21.x 可能无法正常游戏。
enable_deep_translation = true

# 只翻译这些包ID（实测 2193→2225 需要翻译的 8 个）。
# 留空/删除该项则使用内置默认列表：[11, 12, 13, 44, 58, 77, 93, 348]
# only_packet_ids = [11, 12, 13, 44, 58, 77, 93, 348]

# 严格模式：跨版本且翻译失败时阻断该包（谨慎，默认 false=放行）
strict = false

# ============ 物品 ID 映射（服务器→老客户端，防止方块物品变空气）============

# 是否启用物品 ID 映射与"防空气"兜底。建议开启。
# 原理：1.26 的方块物品用 id=0 + block_runtime_id 表示，而 1.21 老客户端会把
#       id=0 当成"空物品"直接丢弃，导致方块物品显示成空气。开启后会把 id=0
#       的方块物品改成一个老客户端认识的非 0 物品 ID，就不会再变空气。
enable_item_remap = true

# 兜底物品 ID：方块物品没有在下面 item_id_map 里配置时，用这个 ID 代替 id=0。
# 必须是 1.21 客户端确实存在的物品 ID。默认 1 = minecraft:stone（石头）。
# 设成 0 则不做兜底（方块物品可能仍显示空气，不建议）。
fallback_item_id = 1

# 物品 ID 映射表：左边 = 1.26 新物品 ID 或方块 block_runtime_id，右边 = 1.21 已有物品 ID。
# 也可以在服务器管理面板的「插件配置 → 物品 ID 映射」里可视化增删，改完重启服务器生效。
# 数字写法（推荐，直接对应物品描述符的 id / block_runtime_id）：
#   12345 = 1       # 1.26 物品 id 12345 → 1.21 的石头(id=1)
#   20001 = 5       # 1.26 方块 bri 20001 → 1.21 的木板(id=5)
# 左边填 1.26 的新物品 id 或方块 block_runtime_id，右边填 1.21 确实存在的物品 id。
[item_id_map]
# 示例（按需取消注释，或用面板添加）：
# 12345 = 1

# ============ 通用 ============

# 输出详细调试日志（会打印协议号改写判定和每次翻译）
debug = false

# 关闭时输出统计（握手命中率 + 分档 + 翻译统计）
enable_stats = true
