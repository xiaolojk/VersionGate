# ProtocolBridge v2.0 配置
# 跨版本包翻译：让旧版 1.26.x 客户端的包被新版服务器正确解析

# 是否启用翻译（关闭则只记录不改写）
enable_translation = true

# 只翻译这些包ID（实测 2193→2225 需要翻译的 8 个）。
# 留空/删除该项则使用内置默认列表。
# only_packet_ids = [11, 12, 13, 44, 58, 77, 93, 348]

# 严格模式：跨版本且翻译失败时阻断该包（谨慎，默认 false=放行）
strict = false

# 输出详细调试日志
debug = false

# 关闭时输出翻译统计
enable_stats = true
