# VersionGate 配置 (v1.3)

# 是否启用版本绕行（让 1.26.x 各版本进入服务器）
enable_version_bypass = true

# 是否启用玩家进服全服通报
enable_join_announcement = true

# 进服通报消息模板，可用占位符：{name} 玩家名，{version} 游戏版本
announcement_template = "[{name}]该玩家是[{version}]，欢迎你加入服务器！"

# 【v1.3 核心】1.26.x 协议号精确白名单
# 只有协议号在此列表内的客户端才会被改写，杜绝误伤 1.21.x 等跨代版本。
# 各协议号对应版本（minecraft.wiki 权威数据）：
#   2225 = 26.60~26.66（服务器本代，无需改写）
#   2193 = 26.50~26.52
#   2169 = 26.45
#   2168 = 26.40~26.44
#   1001 = 26.30~26.35
#   975  = 26.20~26.23
#   944  = 26.10~26.13
#   924  = 1.26.0~26.3
# 想只放行相邻版本（最稳），可改成 [2193, 2225]；
# 想放行全 1.26.x，保持下面的完整列表。
allowed_protocols = [924, 944, 975, 1001, 2168, 2169, 2193, 2225]

# 最大协议号差值（最后兜底）。默认 1400 可覆盖 2225-924=1301 的整个 1.26.x 跨度。
# 一般无需改动；白名单才是主判定。
max_protocol_diff = 1400

# 是否输出详细调试日志（排查版本问题时可开启，会打印每个客户端的协议号和版本标签）
debug = false

# 是否启用运行统计：禁用时输出缓存命中率 + 按协议号分档的改写/跳过次数
# 想看实际进来的是哪些 1.26.x 版本，把它设为 true
enable_stats = false
