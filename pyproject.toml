[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-versiongate"
version = "1.2.0"
description = "Allow Minecraft Bedrock 1.26.x clients to join and announce each player's game version on join. v1.2 adds thread-safe cache and observability."

[project.entry-points."endstone"]
versiongate = "endstone_versiongate:VersionGatePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_versiongate"]
